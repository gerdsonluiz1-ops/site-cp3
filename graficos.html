        <nav>
            <ul>

        <button type="button" id="btn-tema" class="btn-tema">Tema escuro</button>
    </header>

    <main>
        <section>
            <article style="text-align: center;">
                <h2>SVG</h2>
                <p>Gráfico criado diretamente em HTML:</p>


                <svg width="200" height="200" viewBox="0 0 200 200" style="margin-top: 1rem;">

                    <circle cx="100" cy="100" r="80" fill="#e0f2fe" stroke="#0284c7" stroke-width="4" />

                    <polygon points="100,30 115,85 170,100 115,115 100,170 85,115 30,100 85,85" fill="#38bdf8"
                        stroke="#0c4a6e" stroke-width="2" />

                    <circle cx="100" cy="100" r="12" fill="#ffffff" stroke="#0c4a6e" stroke-width="2" />
                </svg>
            </article>
        </section>

        <section style="grid-column: 1 / -1;">
            <article style="text-align: center;">
                <h2>Elemento Canvas:</h2>
                <p>Desenho interativo feito via JavaScript:</p>
                <canvas id="meuCanvas" width="300" height="180"
                    style="border: 2px solid #38bdf8; border-radius: 8px; margin-top: 1rem; background-color: #ffffff;"></canvas>
            </article>
        </section>
    </main>
